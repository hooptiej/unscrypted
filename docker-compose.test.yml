# Test instance: HomeKit OFF (no second bridge in the family's Home app), its own ports and its
# own ./config, ./data and ./secrets (run it from a separate folder, ~/unscrypted-test on the NAS).
# HAP off also keeps motion sources (and the ONVIF notify port) off, so it can't fight prod.
#
#   sudo docker compose -f docker-compose.yml -f docker-compose.test.yml -p unscrypted-test up -d --build
#
# Dashboard: http://<host>:8181, tab title "Homedash - TEST".
# Admin pane: http://<host>:8191 (live preview video on go2rtc WebRTC port 8558), tab title "unscrypted admin - TEST". Rebuild to test changes.
services:
  unscrypted:
    image: unscrypted:0.1.8-test
    container_name: unscrypted-test
    environment:
      - UNSCRYPTED_HAP=off
      - UNSCRYPTED_ADMIN_PORT=8191
      - UNSCRYPTED_GO2RTC_API_PORT=1987
      - UNSCRYPTED_GO2RTC_WEBRTC_PORT=8558
      # Its own loopback restream port (prod has 8554 on the same host network).
      - UNSCRYPTED_GO2RTC_RTSP_PORT=8564
      # HomeKit is off here, so nothing would start a recording buffer: run them anyway, so the
      # restream path (buffer -> go2rtc -> camera) is exercised on the test instance.
      - UNSCRYPTED_TEST_PREBUFFER=all
      - UNSCRYPTED_ADMIN_TITLE=unscrypted admin - TEST
      - UNSCRYPTED_RUNTIME_DIR=/tmp/unscrypted-test
      - UNSCRYPTED_DASH_PORT=8181
      - UNSCRYPTED_DASH_TITLE=Homedash - TEST
    volumes:
      # Page-only fast loop on the test instance: edit web/dash on the box, reload the browser, no
      # rebuild. Test only; prod keeps the page baked into the image.
      - ./web/dash:/app/web/dash:ro
