<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="stage">
  <div id="canvas">
    <div class="in">
      <div id="notice" class="notice gone" role="status"></div>
      <section class="left">
        <div class="cams" id="cams"></div>
      </section>
      <section class="right">
        <div class="photo placeholder" id="photo"><span>Loading photos&hellip;</span></div>
        <div class="svc placeholder" id="svc"><span>Checking services&hellip;</span></div>
        <a class="settings-btn" href="/admin?from=dash">Settings</a>
      </section>
      <div class="band">
        <div class="clock" id="clock">--:--</div>
        <div class="date">
          <div class="day" id="day"></div>
          <div class="mute" id="date"></div>
        </div>
        <div class="wx mute" id="wx"></div>
      </div>
      <div class="full gone" id="full">
        <div class="v" id="fullv">
          <button class="fback" id="fback" type="button">&larr; Back</button>
          <div class="fname" id="fname"></div>
          <div class="flive">live</div>
        </div>
        <div class="fbarwrap">
          <div class="frow"><span id="ftxt"></span><span>tap anywhere to stay</span></div>
          <div class="ftrack"><div id="fbar"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
