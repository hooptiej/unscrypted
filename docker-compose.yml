# unscrypted — docker compose deployment (e.g. on the TrueNAS Docker host).
#
# HomeKit discovery relies on mDNS/Bonjour, which does not cross Docker's bridge
# network — so host networking is REQUIRED. The container shares the host's
# network stack; config.bridge.port is the TCP port the HAP server listens on.
#
# Bring up:   docker compose up -d --build
# Logs / pairing code:   docker compose logs -f
# Redeploy: copy the new files in, then docker compose up -d --build
# Admin pane: http://<host>:8190 (password in ./secrets/admin_password).
# Dashboard: http://<host>:8180 (watch-only, no sign-in).

services:
  unscrypted:
    build:
      context: .
      dockerfile: Dockerfile
    image: unscrypted:0.1.1
    container_name: unscrypted
    restart: unless-stopped
    # REQUIRED for HomeKit mDNS discovery. Linux host only.
    network_mode: host
    volumes:
      # Config folder: ./config/config.json holds camera passwords (gitignored, never commit it).
      # A folder, not a single file, so it can be saved atomically later (admin pane, #2).
      - ./config:/config
      # HAP pairing state lives in ./data/persist. NEVER delete ./data: losing it means
      # re-adding every camera in the Home app.
      - ./data:/data
    environment:
      - UNSCRYPTED_CONFIG=/config/config.json
      - UNSCRYPTED_PERSIST_DIR=/data/persist
      - UNSCRYPTED_LOG_LEVEL=info
      - UNSCRYPTED_ADMIN_PORT=8190
      - UNSCRYPTED_GO2RTC_API_PORT=1986
      - UNSCRYPTED_ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - UNSCRYPTED_ADMIN_KEY_FILE=/data/admin-session.key
      # The open, watch-only living-room dashboard (no sign-in). Its settings live in ./data/dash.
      # UNSCRYPTED_DASH_HOST picks one address (default 0.0.0.0, every address); UNSCRYPTED_DASH=off turns it off.
      # Its settings page is <admin>/dash-settings (admin password). When the dash and the admin pane
      # live on different addresses, set UNSCRYPTED_ADMIN_URL (the Settings button's target, e.g.
      # http://10.0.1.78:8190) and UNSCRYPTED_DASH_URL (e.g. http://10.0.1.248/). Unset = same host.
      - UNSCRYPTED_DASH_PORT=8180
