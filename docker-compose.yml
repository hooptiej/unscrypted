# unscrypted — docker compose deployment (e.g. on the TrueNAS Docker host).
#
# HomeKit discovery relies on mDNS/Bonjour, which does not cross Docker's bridge network — so host
# networking is REQUIRED. The container shares the host's network stack.
#
# Per-install settings come from `.env` next to this file (copy `.env.example`). Nothing here is
# specific to one host, network or house: the install's version, bind addresses and dashboard URL
# all come from `.env`, so this file is byte-for-byte the same on every install.
#
#   cp .env.example .env            # set UNSCRYPTED_VERSION (and any install-specific values)
#   docker compose up -d --build
#   docker compose logs -f          # logs / HomeKit pairing code
# Admin pane:  http://<host>:8190 (or UNSCRYPTED_ADMIN_PORT); password in ./secrets/admin_password.
# Dashboard:   http://<host>:8180 (or UNSCRYPTED_DASH_PORT); watch-only, no sign-in.
#
# A second instance on the same host (the test install) adds docker-compose.test.yml through
# COMPOSE_FILE in its own folder's `.env`; see docker-compose.test.yml.

services:
  unscrypted:
    build:
      context: .
      dockerfile: Dockerfile
      # Build stamp (#102): the git short sha + UTC build date baked into the image. Empty by default
      # (a plain build shows "source"); scripts/deploy.sh fills these in via .env on a real deploy.
      args:
        UNSCRYPTED_BUILD_SHA: ${UNSCRYPTED_BUILD_SHA:-}
        UNSCRYPTED_BUILD_DATE: ${UNSCRYPTED_BUILD_DATE:-}
    # The version has no default on purpose: compose refuses to start until `.env` names a release,
    # so nobody runs an unknown build. Images are never tagged `latest`.
    image: "unscrypted:${UNSCRYPTED_VERSION:?set UNSCRYPTED_VERSION to a release (e.g. 0.1.15) in .env}"
    container_name: unscrypted
    restart: unless-stopped
    # REQUIRED for HomeKit mDNS discovery. Linux host only.
    network_mode: host
    # Not root (#45): the image's entrypoint starts as root only to hand ./config and ./data to the
    # `node` user (uid 1000; it backs up data/persist first), then runs the app as `node` with
    # permission to listen below port 1024 (the dashboard on port 80). That needs the default
    # container capabilities (CHOWN, SETUID, SETGID, NET_BIND_SERVICE): don't `cap_drop: ALL`
    # without adding those back. To skip the root step, `chown -R 1000:1000 config data` on the
    # host once and set `user: "1000:1000"` here; a dashboard on port 80 then needs the host's
    # net.ipv4.ip_unprivileged_port_start lowered instead.
    volumes:
      # ./config/config.json holds camera passwords (gitignored, never committed). A folder, not a
      # single file, so it can be saved atomically later (admin pane, #2).
      - ./config:/config
      # HAP pairing state lives in ./data/persist. NEVER delete ./data: losing it means re-adding
      # every camera in the Home app.
      - ./data:/data
      # Admin pane password: one line in ./secrets/admin_password (gitignored, mode 600). The folder
      # is mounted, not the file, so a missing file is a clear "no password" message in the pane.
      # NOT read-only any more (#45): the container runs as the unprivileged `node` user, and on start
      # its entrypoint gives that user read access to the files here (group read; the owner stays
      # whoever made them). The app itself only ever reads them.
      - ./secrets:/run/secrets
    environment:
      # --- structural: the same on every install --------------------------------------------------
      - UNSCRYPTED_CONFIG=/config/config.json
      - UNSCRYPTED_PERSIST_DIR=/data/persist
      - UNSCRYPTED_ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - UNSCRYPTED_ADMIN_KEY_FILE=/data/admin-session.key
      - UNSCRYPTED_LOG_LEVEL=${UNSCRYPTED_LOG_LEVEL:-info}
      # Ports on the host network. Override in `.env` only to avoid a clash with something else.
      - UNSCRYPTED_ADMIN_PORT=${UNSCRYPTED_ADMIN_PORT:-8190}
      - UNSCRYPTED_GO2RTC_API_PORT=${UNSCRYPTED_GO2RTC_API_PORT:-1986}
      # go2rtc WebRTC media (the admin pane's live preview and the dashboard tiles).
      - UNSCRYPTED_GO2RTC_WEBRTC_PORT=${UNSCRYPTED_GO2RTC_WEBRTC_PORT:-8557}
      # go2rtc's RTSP restream on 127.0.0.1: the one camera session HomeKit's recording buffers and
      # snapshots read from (one connection per camera, #16).
      - UNSCRYPTED_GO2RTC_RTSP_PORT=${UNSCRYPTED_GO2RTC_RTSP_PORT:-8554}
      - UNSCRYPTED_DASH_PORT=${UNSCRYPTED_DASH_PORT:-8180}
      # The live view's source: camera (default, ~1 s start) or go2rtc (one shared connection, #33).
      - UNSCRYPTED_LIVE_SOURCE=${UNSCRYPTED_LIVE_SOURCE:-camera}
      # --- install-specific: set in `.env`; empty = the app's own default -------------------------
      # Pin the HAP server + mDNS advertisement to one host address (empty = every address). Set it
      # where the host has more than one address and HomeKit should advertise a specific one.
      - UNSCRYPTED_HAP_BIND=${UNSCRYPTED_HAP_BIND:-}
      # Give the watch-only dashboard its own address/URL when it lives apart from the admin pane
      # (empty = same host, every address). UNSCRYPTED_ADMIN_URL is the admin pane's URL when the
      # dashboard is elsewhere. See .env.example.
      - UNSCRYPTED_DASH_HOST=${UNSCRYPTED_DASH_HOST:-}
      - UNSCRYPTED_DASH_URL=${UNSCRYPTED_DASH_URL:-}
      - UNSCRYPTED_ADMIN_URL=${UNSCRYPTED_ADMIN_URL:-}
      # Extra debug logging (empty = off), e.g. HAP-NodeJS:Camera*,HAP-NodeJS:EventedHTTPServer*.
      - DEBUG=${UNSCRYPTED_DEBUG:-}
